[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowforge-engine"
version = "0.1.0"
description = "Durable distributed workflow execution engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Anas Ben Mim" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "locust>=2.32,<3",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge"]

[tool.pytest.ini_options]
addopts = "-q --cov=flowforge --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

